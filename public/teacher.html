<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Profile - FRWS</title>
  <link rel="stylesheet" href="/public/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/teacherStyle.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <img src="/public/assets/Emblem_of_Thammasat_University.svg.webp" alt="TU Logo" class="header-logo">
      <h1 class="header-title">
        Faculty Research<br>& Workload Management System (FRWS)
      </h1>
    </div>
  </header>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="#about" class="nav-tab">About</a>
    <a href="#publications" class="nav-tab">Publications</a>
    <a href="#contact" class="nav-tab">Contact</a>
  </nav>

  <!-- Main Container -->
  <div class="teacher-page-container">
    <a href="index.html"
      style="color: #800000; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 20px;">
      &larr; Back to Home
    </a>

    <!-- ABOUT SECTION -->
    <div id="about" class="section-title">About</div>
    <div class="profile-card" id="teacher-profile-card">
      <div style="font-size: 64px; color: #444; display: flex; align-items: center;">
        <i class="fa fa-user-circle"></i>
      </div>
      <div>
        <h2 id="t-name-en" style="margin: 0 0 6px 0; font-size: 1.35rem; color: #111;">กำลังโหลดข้อมูลอาจารย์...</h2>
        <p id="t-name-th" style="margin: 0 0 8px 0; color: #666; font-size: 1rem;"></p>
        <p id="t-faculty" style="margin: 0; color: #444; font-size: 0.95rem; font-weight: 500;"></p>
        <p id="t-department" style="margin: 4px 0 0 0; color: #777; font-size: 0.9rem;"></p>
      </div>
    </div>

    <!-- PUBLICATIONS SECTION -->
    <div id="publications" class="section-title">Publications</div>
    <div id="teacher-publications-list">
      <div class="info-card" style="text-align: center; color: #666;">
        กำลังโหลดรายการงานวิจัย...
      </div>
    </div>

    <!-- CONTACT SECTION -->
    <div id="contact" class="section-title">Contact</div>
    <div class="info-card" style="line-height: 2;">
      <div id="t-email"><i class="fa fa-envelope-o" style="width: 24px; color: #800000;"></i> -</div>
      <div id="t-office"><i class="fa fa-building-o" style="width: 24px; color: #800000;"></i> -</div>
      <div id="t-phone"><i class="fa fa-phone" style="width: 24px; color: #800000;"></i> -</div>
    </div>
  </div>

  <script src="/public/js/teacherScript.js"></script>
</body>

</html>
