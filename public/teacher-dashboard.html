<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Profile - FRWS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="teacherStyle.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <img src="assets/Emblem_of_Thammasat_University.svg.webp" alt="TU Logo" class="header-logo">
      <h1 class="header-title">
        Faculty Research<br>& Workload Management System (FRWS)
      </h1>
    </div>
  </header>

  <!-- Main Container -->
  <div class="teacher-page-container">
    <a href="index.html"
      style="color: #800000; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 20px;">
      &larr; Back to Faculty Members
    </a>

    <div id="profile-actions"></div>
    
    <!-- ABOUT SECTION -->
    <div id="about" class="section-title">About</div>
    <div class="profile-card" id="teacher-profile-card">
      <div>
        <img id="profile_image" style="width: 150px;" alt="Profile Picture">
      </div>
      <div>
        <h2 id="t-name-en" style="margin: 0 0 6px 0; font-size: 1.35rem; color: #111;">กำลังโหลดข้อมูลอาจารย์...</h2>
        <p id="t-name-th" style="margin: 0 0 8px 0; color: #666; font-size: 1rem;"></p>
        <p id="t-faculty" style="margin: 0; color: #444; font-size: 0.95rem; font-weight: 500;"></p>
        <p id="t-department" style="margin: 4px 0 0 0; color: #777; font-size: 0.9rem;"></p>
      </div>
    </div>

    <!-- EXPERTISE -->
    <div id="expertise" class="section-title">Expertise</div>
    <div id="teacher-expertise-list">
      <div class="info-card" id="t-expertise" style="margin: 0 0 8px 0; color: #666; font-size: 1rem;"></div>
    </div>

    <!-- RESEARCH INTERESTS -->
    <div id="research-interests" class="section-title">Research Interests</div>
    <div id="teacher-research-interests-list">
      <div class="info-card" id="t-research_interests" style="margin: 0 0 8px 0; color: #666; font-size: 1rem;"></div>
    </div>

    <!-- EDUCATION -->
    <div id="education" class="section-title">Education</div>
    <div id="teacher-education-list">
      <div class="info-card" id="t-education" style="margin: 0 0 8px 0; color: #666; font-size: 1rem;"></div>
    </div>

    <!-- WORKLOADS & PUBLICATIONS SECTION -->
    <div id="workloads-section" class="workload-main-header">
      <div class="header-title-box">
        <div class="red-line-bar"></div>
        <div>
          <h2>ภาระงานและผลงานวิชาการ</h2>
          <p>ข้อมูลภาระงานตามแบบฟอร์มรายงานผลการปฏิบัติงาน</p>
        </div>
      </div>
    </div>

    <!-- Sub Navigation Tabs (หมวดหมู่ 1-5) -->
    <div class="workload-sub-tabs">
      <button class="sub-tab active" onclick="switchWorkloadTab('TEACHING', this)">1. งานสอน</button>
      <button class="sub-tab" onclick="switchWorkloadTab('ADVISING', this)">2. การดูแลนักศึกษา</button>
      <button class="sub-tab" onclick="switchWorkloadTab('RESEARCH', this)">3. งานวิจัย/วิชาการ</button>
      <button class="sub-tab" onclick="switchWorkloadTab('ADMINISTRATIVE', this)">4. งานบริหาร</button>
      <button class="sub-tab" onclick="switchWorkloadTab('SERVICE', this)">5. งานบริการและผลงานอื่น</button>
    </div>

    <!-- Search & Filter Box (แบบรวมกล่องเดียวกัน) -->
    <div class="workload-search-box" style="display: flex; align-items: center; border: 1px solid #ddd; border-radius: 30px; background-color: #fff; margin-bottom: 20px; overflow: hidden; padding: 0 15px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);">
      <!-- กล่องพิมพ์ข้อความ (ด้านซ้าย) -->
      <input type="text" id="search-input" placeholder="ค้นหาตามรหัสวิชา, ชื่องาน, หรือบทบาท..." style="flex: 1; border: none; padding: 12px 5px; outline: none; font-family: inherit; background: transparent; font-size: 0.95rem;">
      <!-- เส้นคั่นและตัวกรอง Dropdown (ด้านขวา) -->
      <div style="border-left: 1px solid #ddd; padding-left: 12px; display: flex; align-items: center;">
        <select id="dynamic-filter-select" style="border: none; outline: none; background: transparent; font-family: inherit; color: #555; cursor: pointer; font-size: 0.95rem; min-width: 180px;">
          <option value="all">ทั้งหมด</option>
        </select>
      </div>
    </div>

    <!-- Dynamic Content Container -->
    <div id="workload-cards-container">
      <div class="info-card" style="text-align: center; color: #666;">กำลังโหลดข้อมูลภาระงานและผลงานวิชาการ...</div>
    </div>

    <!-- CONTACT SECTION -->
    <div id="contact" class="section-title">Contact</div>
    <div class="info-card" style="line-height: 2;">
      <div id="t-email"><i class="fa fa-envelope-o" style="width: 24px; color: #800000;"></i> -</div>
      <div id="t-office_address"><i class="fa fa-building-o" style="width: 24px; color: #800000;"></i> -</div>
      <div id="t-phone"><i class="fa fa-phone" style="width: 24px; color: #800000;"></i> -</div>
    </div>
  </div>

  <script src="js/teacherScript.js"></script>
</body>

</html>
