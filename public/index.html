<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Research & Workload Management System (FRWS)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* 🎨 CSS จัดแถวแนวนอนสำหรับ Authors */
    .authors-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .author-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .hidden-authors {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <img src="assets/Emblem_of_Thammasat_University.svg.webp" alt="TU Logo" class="header-logo">
      <h1 class="header-title">
        Faculty Research<br>& Workload Management System (FRWS)
      </h1>
    </div>
  </header>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <button class="nav-tab active" id="tab-publications" onclick="switchTab('publications')">Publications</button>
    <button class="nav-tab" id="tab-authors" onclick="switchTab('authors')">Faculty Members</button>
  </nav>

  <!-- Main Content Layout -->
  <main class="main-container">
    
    <!-- เพิ่ม Sidebar สำหรับ Filter & Search ตรงนี้ -->
    <aside class="sidebar" id="filter-sidebar">
      <div class="filter-group">
        <h3>กรองผลงานวิจัย</h3>
        
        <label for="search-input">ค้นหาชื่อผลงาน / ผู้แต่ง</label>
        <input type="text" id="search-input" placeholder="พิมพ์คำค้นหา..." oninput="debounceSearch()">

        <label for="year-filter">ปีที่ตีพิมพ์ (Year)</label>
        <select id="year-filter" onchange="applyFilters()">
          <option value="">ทั้งหมด (All Years)</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
          <option value="2020">2020</option>
        </select>

        <label for="type-filter">หมวดหมู่ภาระงาน (Type)</label>
        <select id="type-filter" onchange="applyFilters()">
          <option value="">ทั้งหมด (All Types)</option>
          <option value="ARTICLE">Article (บทความวิจัย)</option>
          <option value="CONFERENCE">Conference (การประชุมวิชาการ)</option>
          <option value="BOOK">Book / Chapter (หนังสือ/ตำรา)</option>
        </select>
      </div>
    </aside>

    <section class="content-area">
      <div id="cards-container" class="cards-list">
        <p style="text-align: center; color: #666; padding: 20px;">กำลังโหลดข้อมูล...</p>
      </div>
      <div id="pagination" class="pagination"></div>
    </section>
  </main>
  <script src="js/index.js"></script>
</body>

</html>
