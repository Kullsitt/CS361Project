name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python and JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend scripts tests

      - name: Run offline API tests
        run: python tests/test_dashboard_api.py

      - name: Run workload scoring tests
        run: node tests/workload-scoring.cjs

      - name: Check workload rule catalog
        run: node scripts/export-workload-rules.cjs --check
